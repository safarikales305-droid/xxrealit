# Railway: Root Directory služby MUSÍ být nestjs-backend (ne kořen monorepa).
# V UI: Service → Settings → Root Directory → nestjs-backend
# Nebo použijte railway.json v kořeni repa (rootDirectory: nestjs-backend).
#
# Build: npm run build (prisma generate --schema=prisma/schema.prisma)
# Env: PLAYWRIGHT_BROWSERS_PATH=0 (viz nixpacks.toml)
# Start: npm run start:prod

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start:prod"
