# Kořen služby v Railway UI nastav na tento adresář (nestjs-backend).
# Build: npm run build (včetně playwright install chromium do node_modules).
# Env: PLAYWRIGHT_BROWSERS_PATH=0 (viz nixpacks.toml).
# Start: node dist/main.js

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start:prod"
